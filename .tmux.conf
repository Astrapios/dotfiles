# General Tmux Settings
# {{{
# To use colorful status bar/vim themes
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ',xterm-256color*:Tc:sitm=\E[3m'

# this fixes system clipboard copy and paste issues in vim when ran inside tmux
set -s set-clipboard on

#set -g default-shell $SHELL
#set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# eliminate delays on ESC
set -s escape-time 0

# activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# vim like copy mode
setw -g mode-keys vi

# pane switching using mouse
set-option -g mouse on

# Toggle mouse on/off with Prefix + m  (robust: no \; command separators)
bind-key m run-shell " \
  if [ \"\$(tmux show -gv mouse)\" = on ]; then \
    tmux set -g mouse off; \
    tmux display-message 'Mouse: OFF (browser selection enabled)'; \
  else \
    tmux set -g mouse on; \
    tmux display-message 'Mouse: ON (pane click + scroll enabled)'; \
  fi \
"

# do not automatically rename windows!
# set-window-option -g automatic-rename off
# }}}

# Key bindings
# {{{

# change prefix key combination
unbind C-b
set -g prefix C-a

# for use with 'setw -g mode-keys vi'
bind-key -T copy-mode-vi v send -X begin-selection

# The universal "y" and "Enter" bind for ttyd/local
# This pipes the selection to a small script that sends the OSC 52 sequence
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "base64 | tr -d '\n' | awk '{print \"\\033]52;c;\" \$0 \"\\007\"}' > /dev/tty"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "base64 | tr -d '\n' | awk '{print \"\\033]52;c;\" \$0 \"\\007\"}' > /dev/tty"

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "base64 | xargs -0 printf '\033]52;c;%s\007'"
# Mouse drag-select + release: copy to the system clipboard via OSC 52
# (tmux's set-clipboard forwarding; the terminal must handle OSC 52 - ttyd
# built from main, iTerm2, kitty, ...). Added 2026-09-14 for ttyd.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
set -ag terminal-features ',xterm-256color:clipboard'
# tmux's stock Ms sends OSC 52 with an EMPTY selection field ("\e]52;;<b64>\a").
# xterm.js's clipboard addon (ttyd) only writes when the selection is exactly
# "c", so force it. Both %p1 and %p2 must appear or tmux 3.4's tiparm_s()
# refuses to expand the capability and nothing is sent at all.
set -as terminal-overrides 'xterm*:Ms=\E]52;c%p1%s;%p2%s\a'
# Claude Code hard-wraps its output (real newlines + indent per row), so a
# copied long line arrives broken. prefix J re-copies the LAST selection as
# one line (drag first, then C-a J); Y in copy mode copies the selection
# joined right away. Both re-send via OSC 52 (load-buffer -w). The script
# glues URL/path tokens split at the pane edge (needs the pane width) and
# turns other breaks into one space.
bind J run-shell "tmux show-buffer | python3 ~/.dotfiles/scripts/tmux_join_lines.py '#{pane_width}' | tmux load-buffer -w -"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "python3 ~/.dotfiles/scripts/tmux_join_lines.py '#{pane_width}' | tmux load-buffer -w -"
# pane resizing with hjkl
bind j resize-pane -D 10
bind k resize-pane -U 10
bind l resize-pane -R 10
bind h resize-pane -L 10

# pane switching with ctrl + hjkl
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# splitting to more intuitive keys
unbind-key %
bind-key | split-window -h
bind-key \\ split-window -hb
unbind-key '"'
bind-key _ split-window -v
bind-key - split-window -vb

unbind M-h
unbind M-j
unbind M-k
unbind M-l
unbind-key C-p
unbind-key C-n
unbind-key M-left
unbind-key M-right

# kill session shortcut
bind K confirm-before kill-session

# reload tmux config + source .zshrc in all idle shell panes
bind r run-shell "tmux source-file ~/.tmux.conf && \
  for pane in \$(tmux list-panes -a -F '##{pane_id} ##{pane_current_command}' | grep zsh | cut -d' ' -f1); do \
    tmux send-keys -t \$pane 'source ~/.zshrc' Enter; \
  done && \
  tmux display-message 'Reloaded tmux.conf + .zshrc'"

# toggle pane title visibility
bind T run 'zsh -c "arr=( off top ) && tmux setw pane-border-status \${arr[\$(( \${arr[(I)#{pane-border-status}]} % 2 + 1 ))]}"'
# rename pane
bind t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"
# }}}

# tmux plugins
# {{{
# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Additional Plugins
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g status-interval 2
set -g status-right "#S #[fg=green,bg=black]#(tmux-mem-cpu-load --colors --interval 2)#[default]"
set -g status-right-length 60

# Active window highlight
set -g window-status-current-style 'bg=colour39,fg=colour232,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=colour232,bg=default'
set -g window-status-format ' #I:#W '

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# }}}
